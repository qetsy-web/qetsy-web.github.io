     <div id="footer-placeholder"></div>

     <script>
       fetch('../components/footer.html')
         .then(res => res.text())
         .then(data => {
           document.getElementById('footer-placeholder').innerHTML = data;
         });
     </script>

     este archivo, afectando todas las páginas que lo incluyan.
-->
