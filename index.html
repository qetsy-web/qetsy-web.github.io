<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Qetsy Web</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <!-- Header modular -->
  <div id="header-placeholder"></div>
  <script>
    fetch('components/header.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;
        // Cargar nav dentro del header
        fetch('components/nav.html')
          .then(res => res.text())
          .then(navData => {
            document.getElementById('nav-placeholder').innerHTML = navData;
          });
      });
  </script>

  <!-- Main content -->
  <main>
    <!-- Bienvenida -->
    <section class="section">
      <h2>Bienvenido a Qetsy Web</h2>
      <p>Aquí encontrarás escritos, proyectos, servicios, contenido gratuito y mucho más. Todo modular y escalable.</p>
    </section>

    <!-- Destacados del Blog -->
    <section class="section">
      <h3>Últimas entradas del blog</h3>
      <div id="blog-cards-container"></div>
      <script>
        const blogEntries = [
          { title: "Entrada 1", description: "Resumen de la primera entrada", url: "blog/entradas/001.txt" },
          { title: "Entrada 2", description: "Resumen de la segunda entrada", url: "blog/entradas/002.txt" }
        ];
        fetch('components/card.html')
          .then(res => res.text())
          .then(cardTemplate => {
            const container = document.getElementById('blog-cards-container');
            blogEntries.forEach(item => {
              const card = document.createElement('div');
              card.innerHTML = cardTemplate;
              card.querySelector('.card-title').textContent = item.title;
              card.querySelector('.card-desc').textContent = item.description;
              card.querySelector('.card-link').href = item.url;
              container.appendChild(card);
            });
          });
      </script>
    </section>

    <!-- Destacados de la Tienda -->
    <section class="section">
      <h3>Productos destacados</h3>
      <div id="shop-cards-container"></div>
      <script>
        const shopItems = [
          { title: "Objeto físico 1", description: "Descripción corta del producto", url: "shop/productos/1.html" },
          { title: "Servicio 1", description: "Descripción breve del servicio", url: "shop/servicios/1.html" }
        ];
        fetch('components/card.html')
          .then(res => res.text())
          .then(cardTemplate => {
            const container = document.getElementById('shop-cards-container');
            shopItems.forEach(item => {
              const card = document.createElement('div');
              card.innerHTML = cardTemplate;
              card.querySelector('.card-title').textContent = item.title;
              card.querySelector('.card-desc').textContent = item.description;
              card.querySelector('.card-link').href = item.url;
              container.appendChild(card);
            });
          });
      </script>
